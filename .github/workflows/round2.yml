name: macos-messages-automation-probe2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe2:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: build helpers
        run: |
          cd src
          swiftc -O ocr.swift -o ocr && swiftc -O cgui.swift -o cgui && ls -l cgui ocr
      - name: run round-2 probe
        env:
          OUT: ${{ github.workspace }}/out2
        run: |
          cd src; mkdir -p "$OUT"; bash probe2.sh || echo "PROBE2_EXIT=$?"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messages-probe2-evidence
          path: out2
          if-no-files-found: warn
