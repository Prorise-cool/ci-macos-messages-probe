name: ios-sim-appleid-create12
on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'phone digits (E.164 without +)'
        required: false
        default: '447450699185'
permissions:
  contents: read
  secrets: write
jobs:
  create12:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: build helpers
        run: |
          cd src
          swiftc -O ocrbox.swift -o ocrbox
          swiftc -O drag.swift -o drag
          swiftc -O cgui.swift -o cgui
          ls -l ocrbox drag cgui
      - name: run probe12
        env:
          OUT: ${{ github.workspace }}/out12
          PHONE_PRIMARY: ${{ inputs.phone }}
          SECRET_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRETS_PATH: ${{ runner.temp }}/p12_secrets.txt
        run: |
          cd src
          mkdir -p "$OUT"
          python3 probe12.py || echo "PROBE12_EXIT=$?"
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-appleid-create12-evidence
          path: ${{ github.workspace }}/out12
          if-no-files-found: warn
      - name: scrub local secrets
        if: always()
        run: rm -f "${RUNNER_TEMP}/p12_secrets.txt" 2>/dev/null || true
